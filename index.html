<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스톱모션 애니메이션 만들기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#22303c;--sub:#667785;--line:#d6dee5;--acc:#1f7a8c;--acc2:#e8f3f5;--warn:#c4513a;--stage:#1d2730;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b21;--panel:#1d262d;--ink:#e6edf2;--sub:#93a3b0;--line:#33414c;--acc:#4fb3c5;--acc2:#1f3a41;--warn:#e27c66;--stage:#0c1115}}
:root[data-theme="dark"]{--bg:#141b21;--panel:#1d262d;--ink:#e6edf2;--sub:#93a3b0;--line:#33414c;--acc:#4fb3c5;--acc2:#1f3a41;--warn:#e27c66;--stage:#0c1115}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
.lead{margin:0 0 18px;color:var(--sub);font-size:.95rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.stage{position:relative;background:var(--stage);border-radius:10px;overflow:hidden;aspect-ratio:16/9}
canvas{width:100%;height:100%;display:block}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#cfdbe3;text-align:center;padding:16px;border:2px dashed #4a5b68;border-radius:10px;margin:10px;cursor:pointer}
.empty.over{border-color:#4fb3c5;background:rgba(79,179,197,.12)}
.empty b{font-size:1.1rem}
.hidden{display:none!important}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
button:hover,.btn:hover{background:var(--acc2)}
button:focus-visible,.btn:focus-visible,.thumb:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.primary:hover{background:var(--acc);filter:brightness(1.1)}
button:disabled{opacity:.5;cursor:not-allowed}
.count{margin-left:auto;color:var(--sub);font-size:.9rem}
.speed{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.speed button{padding:8px 4px;font-size:.88rem;line-height:1.3}
.speed button small{display:block;color:var(--sub);font-weight:400}
.speed button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.speed button.on small{color:#e6f4f7}
.lbl{font-weight:700;font-size:.95rem;margin:16px 0 0}
.strip{display:flex;gap:10px;overflow-x:auto;padding:10px 2px 6px;min-height:130px}
.thumb{position:relative;flex:0 0 112px;border:2px solid var(--line);border-radius:8px;background:var(--panel);padding:4px;cursor:grab;user-select:none}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;display:block;pointer-events:none}
.thumb.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.thumb.drag{opacity:.35}
.thumb.target{border-color:var(--warn);border-style:dashed}
.thumb .no{position:absolute;top:6px;left:6px;background:var(--acc);color:#fff;font-size:.75rem;border-radius:10px;padding:0 7px}
.tools{display:flex;justify-content:space-between;margin-top:4px}
.tools button{padding:2px 8px;font-size:.85rem}
.tools .del:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
.hint{color:var(--sub);font-size:.85rem;margin:2px 0 0}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;width:0;background:var(--acc)}
#msg{font-size:.9rem;color:var(--sub);margin-top:6px;min-height:1.4em}
</style>
</head>
<body>
<div class="wrap">
  <h1>스톱모션 애니메이션 만들기</h1>
  <p class="lead">사진을 올리고 순서를 바꾼 뒤, 재생 속도를 골라 영상으로 저장해 보세요.</p>

  <div class="card">
    <div class="stage" id="stage">
      <canvas id="cv" width="1280" height="720"></canvas>
      <div class="empty" id="empty" tabindex="0" role="button" aria-label="사진 올리기">
        <b>여기에 사진을 끌어다 놓거나 눌러서 고르세요</b>
        <span>사진을 2장 이상 올리면 애니메이션이 만들어져요</span>
      </div>
    </div>

    <div class="bar">
      <button id="play" class="primary" disabled>▶ 재생</button>
      <label class="btn" for="file">+ 사진 추가</label>
      <input id="file" type="file" accept="image/*" multiple class="hidden">
      <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="loop"> 반복 재생</label>
      <button id="clear" disabled>모두 지우기</button>
      <span class="count" id="count">사진 0장</span>
    </div>

    <p class="lbl">재생 속도</p>
    <div class="speed" id="speed" role="group" aria-label="재생 속도"></div>

    <p class="lbl">사진 순서 <span class="hint">· 사진을 끌어서 옮기거나 ◀ ▶ 버튼을 누르세요</span></p>
    <div class="strip" id="strip"></div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="bar" style="margin-top:0">
      <button id="save" class="primary" disabled>⬇ 영상 파일로 저장</button>
      <span class="hint" id="fmt"></span>
    </div>
    <div class="prog hidden" id="prog"><i id="pbar"></i></div>
    <div id="msg" aria-live="polite"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const SPEEDS=[{n:'아주 느리게',ms:1000},{n:'느리게',ms:500},{n:'보통',ms:250},{n:'빠르게',ms:125},{n:'아주 빠르게',ms:70}];
const cv=$('#cv'),ctx=cv.getContext('2d');
let frames=[],idx=0,playing=false,timer=null,busy=false,dragId=null,uid=0;
let speed=2,loop=true;
try{const s=JSON.parse(localStorage.getItem('stopmotion-settings')||'{}');
 if(Number.isInteger(s.speed)&&s.speed>=0&&s.speed<5)speed=s.speed; if(typeof s.loop==='boolean')loop=s.loop;}catch(e){}
function saveSettings(){try{localStorage.setItem('stopmotion-settings',JSON.stringify({speed,loop}))}catch(e){}}

function drawBlank(){ctx.fillStyle='#1d2730';ctx.fillRect(0,0,1280,720)}
function draw(i){
  const f=frames[i]; if(!f){drawBlank();return}
  ctx.fillStyle='#000';ctx.fillRect(0,0,1280,720);
  const im=f.img,r=Math.min(1280/im.naturalWidth,720/im.naturalHeight),w=im.naturalWidth*r,h=im.naturalHeight*r;
  ctx.drawImage(im,(1280-w)/2,(720-h)/2,w,h);
}

function renderSpeed(){
  const box=$('#speed');box.innerHTML='';
  SPEEDS.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className=i===speed?'on':'';b.setAttribute('aria-pressed',i===speed);
    b.innerHTML=`${i+1}단계<small>${s.n}</small><small>초당 ${(1000/s.ms).toFixed(1).replace('.0','')}장</small>`;
    b.onclick=()=>{speed=i;saveSettings();renderSpeed()};
    box.appendChild(b);
  });
}

function renderStrip(){
  const st=$('#strip');st.innerHTML='';
  frames.forEach((f,i)=>{
    const d=document.createElement('div');
    d.className='thumb'+(i===idx?' cur':'');d.draggable=!busy;d.tabIndex=0;d.dataset.id=f.id;
    d.innerHTML=`<span class="no">${i+1}</span><img src="${f.url}" alt="${i+1}번째 사진">
      <div class="tools"><button class="l" title="앞으로" ${i===0?'disabled':''}>◀</button><button class="del" title="삭제">✕</button><button class="r" title="뒤로" ${i===frames.length-1?'disabled':''}>▶</button></div>`;
    d.onclick=e=>{if(e.target.closest('button'))return;stop();idx=i;draw(i);mark()};
    d.querySelector('.l').onclick=()=>move(i,i-1);
    d.querySelector('.r').onclick=()=>move(i,i+1);
    d.querySelector('.del').onclick=()=>remove(i);
    d.ondragstart=e=>{dragId=f.id;d.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',f.id)};
    d.ondragend=()=>{dragId=null;renderStrip()};
    d.ondragover=e=>{e.preventDefault();if(dragId&&dragId!==f.id)d.classList.add('target')};
    d.ondragleave=()=>d.classList.remove('target');
    d.ondrop=e=>{e.preventDefault();const from=frames.findIndex(x=>x.id===dragId);if(from>-1)move(from,i)};
    st.appendChild(d);
  });
  const n=frames.length;
  $('#count').textContent=`사진 ${n}장`;
  $('#empty').classList.toggle('hidden',n>0);
  $('#play').disabled=n<2||busy;$('#save').disabled=n<2||busy;$('#clear').disabled=n===0||busy;
}
function mark(){document.querySelectorAll('.thumb').forEach((t,i)=>t.classList.toggle('cur',i===idx));
  const c=document.querySelector('.thumb.cur');if(c)c.scrollIntoView({block:'nearest',inline:'nearest'})}

function move(a,b){
  if(b<0||b>=frames.length||a===b)return;
  const cur=frames[idx];const [x]=frames.splice(a,1);frames.splice(b,0,x);
  idx=Math.max(0,frames.indexOf(cur));renderStrip();draw(idx);
}
function remove(i){
  stop();URL.revokeObjectURL(frames[i].url);frames.splice(i,1);
  idx=Math.min(idx,Math.max(0,frames.length-1));renderStrip();draw(idx);
}

function addFiles(list){
  const files=[...list].filter(f=>f.type.startsWith('image/'));
  if(!files.length){$('#msg').textContent='이미지 파일만 올릴 수 있어요.';return}
  files.sort((a,b)=>a.name.localeCompare(b.name,'ko',{numeric:true}));
  let left=files.length;
  files.forEach(file=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{frames.push({id:++uid,url,img});if(--left===0){$('#msg').textContent='';renderStrip();if(frames.length===files.length){idx=0}draw(idx);mark()}};
    img.onerror=()=>{URL.revokeObjectURL(url);if(--left===0){renderStrip();draw(idx)}};
    img.src=url;
  });
}

function tick(){
  if(!playing)return;
  draw(idx);mark();
  timer=setTimeout(()=>{
    idx++;
    if(idx>=frames.length){if(loop)idx=0;else{idx=frames.length-1;stop();return}}
    tick();
  },SPEEDS[speed].ms);
}
function play(){if(frames.length<2)return;if(idx>=frames.length-1&&!loop)idx=0;playing=true;$('#play').textContent='❚❚ 멈춤';tick()}
function stop(){playing=false;clearTimeout(timer);$('#play').textContent='▶ 재생'}
$('#play').onclick=()=>playing?stop():play();
$('#loop').checked=loop;
$('#loop').onchange=e=>{loop=e.target.checked;saveSettings()};
$('#clear').onclick=()=>{if(!confirm('올린 사진을 모두 지울까요?'))return;stop();frames.forEach(f=>URL.revokeObjectURL(f.url));frames=[];idx=0;renderStrip();drawBlank()};

$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
const em=$('#empty');
em.onclick=()=>$('#file').click();
em.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#file').click()}};
['dragenter','dragover'].forEach(t=>$('#stage').addEventListener(t,e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();em.classList.add('over')}}));
['dragleave','drop'].forEach(t=>$('#stage').addEventListener(t,()=>em.classList.remove('over')));
$('#stage').addEventListener('drop',e=>{if(e.dataTransfer.files.length){e.preventDefault();addFiles(e.dataTransfer.files)}});

/* 영상 저장 */
function pickMime(){
  const c=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  return window.MediaRecorder?c.find(m=>MediaRecorder.isTypeSupported(m)):null;
}
const mime=pickMime();
let dl=null;
try{if(window.claude&&claude.use)claude.use('downloads').then(d=>{dl=d}).catch(()=>{})}catch(e){}
$('#fmt').textContent=mime?(mime.startsWith('video/mp4')?'MP4 형식으로 저장돼요.':'WEBM 형식으로 저장돼요. (대부분의 컴퓨터·크롬에서 재생 가능)'):'이 브라우저는 영상 저장을 지원하지 않아요. 크롬이나 엣지를 사용해 보세요.';
if(!mime)$('#save').dataset.off=1;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
$('#save').onclick=async()=>{
  if(!mime||frames.length<2)return;
  stop();busy=true;renderStrip();
  const prog=$('#prog'),bar=$('#pbar');prog.classList.remove('hidden');bar.style.width='0';
  try{
    const stream=cv.captureStream(30),chunks=[];
    const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6e6});
    rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    const done=new Promise(r=>rec.onstop=r);
    rec.start();
    for(let i=0;i<frames.length;i++){
      $('#msg').textContent=`영상을 만드는 중… (${i+1}/${frames.length})`;
      const end=performance.now()+SPEEDS[speed].ms;
      do{draw(i);await sleep(33)}while(performance.now()<end);
      bar.style.width=((i+1)/frames.length*100)+'%';
    }
    await sleep(100);rec.stop();await done;
    const ext=mime.startsWith('video/mp4')?'mp4':'webm';
    const blob=new Blob(chunks,{type:mime.split(';')[0]});
    if(!dl){$('#msg').textContent='이 화면에서는 파일 저장을 사용할 수 없어요. 페이지를 새로고침하거나 다른 브라우저에서 열어 보세요.'}
    else{
      try{await dl.save({filename:'stopmotion.'+ext,data:blob});$('#msg').textContent='저장이 끝났어요! 다운로드 폴더를 확인해 보세요.'}
      catch(e){$('#msg').textContent=(e&&e.code==='declined')?'저장을 취소했어요. 다시 저장하려면 버튼을 눌러 주세요.':'파일을 저장하지 못했어요. 잠시 후 다시 해 보세요.'}
    }
  }catch(err){$('#msg').textContent='영상을 만들지 못했어요. 브라우저를 바꾸거나 사진 수를 줄여 다시 해 보세요.'}
  busy=false;prog.classList.add('hidden');renderStrip();draw(idx);mark();
};

renderSpeed();renderStrip();drawBlank();
</script>
</body>
</html>
